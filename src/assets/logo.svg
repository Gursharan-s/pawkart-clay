  <ellipse cx="50" cy="33.5" rx="9.4" ry="12.2" transform="rotate(-8 50 33.5)" fill="url(#paw)"/>
  <ellipse cx="78" cy="33.5" rx="9.4" ry="12.2" transform="rotate(8 78 33.5)" fill="url(#paw)"/>
  <ellipse cx="94" cy="47" rx="9.6" ry="12.4" transform="rotate(34 94 47)" fill="url(#paw)"/>
