  </defs>
  <!-- plush clay tile -->
  <rect x="8" y="8" width="112" height="112" rx="34" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="112" rx="34" fill="none" stroke="#e9cf9f" stroke-width="3"/>
