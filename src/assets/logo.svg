      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f6e7c8"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59b4a"/>
